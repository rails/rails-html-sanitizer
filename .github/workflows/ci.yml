name: ci
concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v*.*.x
    tags:
      - v*.*.*
  pull_request:
    types: [opened, synchronize]
    branches:
      - '*'

permissions: {}

jobs:
  rubocop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # zizmor: ignore[cache-poisoning] -- cached gems are used for testing, not release artifact generation # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop

  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  cruby:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "2.7", os: ubuntu-24.04 }
          - { ruby: "3.0", os: ubuntu-24.04 }
          - { ruby: "3.1", os: ubuntu-24.04 }
          - { ruby: "3.2", os: ubuntu-latest }
          - { ruby: "3.3", os: ubuntu-latest }
          - { ruby: "3.4", os: ubuntu-latest }
          - { ruby: "4.0", os: ubuntu-latest }
          - { ruby: "ruby-head", os: ubuntu-latest }
          - { ruby: "truffleruby-head", os: ubuntu-latest }
          - { ruby: "jruby-9.4", os: ubuntu-latest }
          - { ruby: "jruby-10.0", os: ubuntu-latest }
          - { ruby: "jruby-head", os: ubuntu-latest }
    runs-on: ${{matrix.os}}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # zizmor: ignore[cache-poisoning] -- cached gems are used for testing, not release artifact generation # v1.329.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler-cache: true
      - run: bundle exec rake

  cruby-nokogiri-system-libraries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
      - name: Install nokogiri with system libraries
        run: |
          sudo apt install pkg-config libxml2-dev libxslt-dev
          bundle config set force_ruby_platform true
          bundle config build.nokogiri --enable-system-libraries
          bundle install
          bundle exec nokogiri -v
      - run: bundle exec rake
